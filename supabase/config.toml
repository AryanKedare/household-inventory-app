project_id = "homestock"

# Public liveness endpoint used only to prove that the hosted Edge Functions
# deployment is online.
[functions.health]
verify_jwt = false

# User-facing functions validate the bearer token inside the function with
# auth.getUser(). Keeping the legacy gateway verifier disabled supports the
# current publishable-key model while preserving authenticated-only behavior.
[functions.create-expense]
verify_jwt = false

[functions.household-ai]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

# This backend-only function authenticates the Supabase secret key in the
# `apikey` header. The key is supplied by the hosted cron job from Vault.
[functions.process-notifications]
verify_jwt = false
