project_id = "homestock"

# Public liveness endpoint used only to prove that the hosted Edge Functions
# deployment is online.
[functions.health]
verify_jwt = false

# Authenticated Edge Functions validate callers with auth.getUser() inside the
# handler. This supports Supabase publishable keys without relying on the legacy
# gateway JWT verifier.
[functions.create-expense]
verify_jwt = false

[functions.suggest-expense-category]
verify_jwt = false

[functions.analyze-household-bill]
verify_jwt = false

[functions.generate-household-insights]
verify_jwt = false

[functions.register-push-device]
verify_jwt = false

# Internal functions are protected with HOMESTOCK_INTERNAL_SECRET because they
# are invoked by a database webhook / cron job rather than a signed-in user.
[functions.notify-household-activity]
verify_jwt = false

[functions.process-push-receipts]
verify_jwt = false
