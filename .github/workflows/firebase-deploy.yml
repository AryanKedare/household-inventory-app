name: Firebase Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Firebase environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Require environment configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_PROJECT_ID" || { echo 'FIREBASE_PROJECT_ID environment variable is required.'; exit 1; }
          test -n "$WIF_PROVIDER" || { echo 'GCP_WORKLOAD_IDENTITY_PROVIDER environment secret is required.'; exit 1; }
          test -n "$WIF_SERVICE_ACCOUNT" || { echo 'GCP_DEPLOY_SERVICE_ACCOUNT environment secret is required.'; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install mobile dependencies
        run: npm install

      - name: Install Functions dependencies
        run: npm --prefix functions install

      - name: Verify exact deployment commit
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run functions:build
          npm run test:functions
          npm run test:rules

      - name: Deploy Firestore and Functions
        run: |
          npx firebase-tools deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only firestore:rules,firestore:indexes,functions \
            --non-interactive
