name: EAS Submit Latest Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store platform
        required: true
        type: choice
        options:
          - ios
          - android

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    environment: production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Require Expo token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo 'EXPO_TOKEN repository secret is required.'
            exit 1
          fi

      - name: Submit latest EAS production build
        shell: bash
        run: |
          npx eas-cli@latest submit \
            --platform '${{ inputs.platform }}' \
            --latest \
            --non-interactive
