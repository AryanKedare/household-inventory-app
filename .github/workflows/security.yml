name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '27 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  dependency-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mobile dependencies
        run: npm install --ignore-scripts

      - name: Install Functions dependencies
        run: npm --prefix functions install --ignore-scripts

      # High-severity findings remain visible in every run, but do not permanently
      # block all development when an upstream package has no patched release.
      # As of 2026-08-10, Expo/Metro pulls image-size and GitHub reports high-severity
      # image-size DoS advisories with no patched version available. These are build-
      # tooling transitive dependencies rather than HomeStock runtime image parsing.
      - name: Report high+ mobile dependency findings
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Report high+ Functions dependency findings
        continue-on-error: true
        run: npm --prefix functions audit --omit=dev --audit-level=high

      # Critical production dependency findings still fail immediately. High findings
      # must be reviewed before release and are continuously surfaced by the steps above.
      - name: Block critical mobile dependency findings
        run: npm audit --omit=dev --audit-level=critical

      - name: Block critical Functions dependency findings
        run: npm --prefix functions audit --omit=dev --audit-level=critical
