name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '27 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  dependency-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install mobile dependencies
        run: npm install --ignore-scripts

      - name: Install Functions dependencies
        run: npm --prefix functions install --ignore-scripts

      # High-severity findings remain visible in every run, but do not permanently
      # block all development when an upstream package has no patched release.
      # Expo/Metro currently pulls image-size versions affected by high-severity
      # parser DoS advisories; npm's proposed forced remediation breaks the supported
      # Expo/React Native stack. Keep this exception under review rather than hiding it.
      - name: Report high+ mobile dependency findings
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Report high+ Functions dependency findings
        continue-on-error: true
        run: npm --prefix functions audit --omit=dev --audit-level=high

      # Critical production dependency findings still fail immediately. High findings
      # must be reviewed before release and are continuously surfaced by the steps above.
      - name: Block critical mobile dependency findings
        run: npm audit --omit=dev --audit-level=critical

      - name: Block critical Functions dependency findings
        run: npm --prefix functions audit --omit=dev --audit-level=critical
