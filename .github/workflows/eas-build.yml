name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        type: choice
        options:
          - ios
          - android
          - all
      profile:
        description: EAS build profile
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Require Expo token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo 'EXPO_TOKEN repository secret is required.'
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Verify before build
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Start EAS cloud build
        shell: bash
        run: |
          npx eas-cli@latest build \
            --platform '${{ inputs.platform }}' \
            --profile '${{ inputs.profile }}' \
            --non-interactive \
            --no-wait
