name: Supabase Schema
on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-schema.yml'
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.101.0
      - run: supabase db start
      - run: supabase db lint --level error
      - if: always()
        run: supabase stop --no-backup || true
