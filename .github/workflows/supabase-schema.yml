name: Supabase Backend
on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-schema.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.101.0
      - name: Start fresh Supabase stack and apply migrations
        run: supabase start
      - name: Lint database functions and schema
        run: supabase db lint --level error
      - name: Smoke test Edge Function bundles
        shell: bash
        run: |
          set -euo pipefail
          supabase functions serve --no-verify-jwt > /tmp/homestock-edge.log 2>&1 &
          edge_pid=$!
          trap 'kill "$edge_pid" 2>/dev/null || true' EXIT

          ready=false
          health_status="000"
          create_expense_status="000"
          category_status="000"
          bill_status="000"
          insights_status="000"
          smoke_household="00000000-0000-4000-8000-000000000000"

          for attempt in $(seq 1 50); do
            if ! kill -0 "$edge_pid" 2>/dev/null; then
              echo "Supabase Edge Function server exited before becoming ready."
              cat /tmp/homestock-edge.log
              exit 1
            fi

            health_status="$(curl --silent --show-error \
              --output /tmp/health.json \
              --write-out '%{http_code}' \
              http://127.0.0.1:54321/functions/v1/health || true)"

            create_expense_status="$(curl --silent --show-error \
              --output /tmp/create-expense.json \
              --write-out '%{http_code}' \
              --request POST \
              --header 'content-type: application/json' \
              --data '{}' \
              http://127.0.0.1:54321/functions/v1/create-expense || true)"

            category_status="$(curl --silent --show-error \
              --output /tmp/category.json \
              --write-out '%{http_code}' \
              --request POST \
              --header 'content-type: application/json' \
              --data "{\"householdId\":\"${smoke_household}\",\"title\":\"Smoke test\"}" \
              http://127.0.0.1:54321/functions/v1/suggest-expense-category || true)"

            bill_status="$(curl --silent --show-error \
              --output /tmp/bill.json \
              --write-out '%{http_code}' \
              --request POST \
              --header 'content-type: application/json' \
              --data "{\"householdId\":\"${smoke_household}\",\"billText\":\"Smoke test\"}" \
              http://127.0.0.1:54321/functions/v1/analyze-household-bill || true)"

            insights_status="$(curl --silent --show-error \
              --output /tmp/insights.json \
              --write-out '%{http_code}' \
              --request POST \
              --header 'content-type: application/json' \
              --data "{\"householdId\":\"${smoke_household}\"}" \
              http://127.0.0.1:54321/functions/v1/generate-household-insights || true)"

            if [ "$health_status" = "200" ] && \
               grep -q '"ok":true' /tmp/health.json && \
               [ "$create_expense_status" = "400" ] && \
               grep -q '"error":"Missing Authorization header"' /tmp/create-expense.json && \
               [ "$category_status" = "400" ] && \
               grep -q '"error":"Missing Authorization header"' /tmp/category.json && \
               [ "$bill_status" = "400" ] && \
               grep -q '"error":"Missing Authorization header"' /tmp/bill.json && \
               [ "$insights_status" = "400" ] && \
               grep -q '"error":"Missing Authorization header"' /tmp/insights.json; then
              ready=true
              break
            fi

            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "Edge Function smoke test did not reach every function auth boundary."
            for probe in health create-expense category bill insights; do
              echo "--- ${probe} ---"
              case "$probe" in
                health) echo "HTTP ${health_status}" ;;
                create-expense) echo "HTTP ${create_expense_status}" ;;
                category) echo "HTTP ${category_status}" ;;
                bill) echo "HTTP ${bill_status}" ;;
                insights) echo "HTTP ${insights_status}" ;;
              esac
              cat "/tmp/${probe}.json" 2>/dev/null || true
              echo
            done
            echo "--- Edge Function runtime log ---"
            cat /tmp/homestock-edge.log
            exit 1
          fi
      - if: always()
        run: supabase stop --no-backup || true
