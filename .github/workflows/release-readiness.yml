name: Production Release Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify application
        run: npm run verify

      - name: Ensure retired platforms are absent
        shell: bash
        run: |
          if grep -R --line-number -E "from ['\"](expo|firebase)(/|['\"])|require\(['\"](expo|firebase)" src App.tsx index.js package.json 2>/dev/null; then
            echo 'Production release blocked: Expo or Firebase runtime imports remain.'
            exit 1
          fi
          node <<'NODE'
          const pkg = require('./package.json');
          const names = Object.keys({ ...(pkg.dependencies || {}), ...(pkg.devDependencies || {}) });
          const retired = names.filter((name) => name === 'expo' || name.startsWith('expo-') || name === 'firebase');
          if (retired.length) {
            console.error(`Production release blocked: retired dependencies remain: ${retired.join(', ')}`);
            process.exit(1);
          }
          NODE

      - name: Ensure server secrets are not exposed to mobile source
        shell: bash
        run: |
          if grep -R --line-number -E 'GROQ_API_KEY[[:space:]]*=|SUPABASE_SERVICE_ROLE' src app.json .env.example 2>/dev/null; then
            echo 'Production release blocked: possible server-secret exposure in mobile configuration.'
            exit 1
          fi

      - name: Require finalized legal documents
        shell: bash
        run: |
          if grep -R --line-number -E '\[(LEGAL_OPERATOR_NAME|CONTACT_EMAIL|COUNTRY_OR_ADDRESS|EFFECTIVE_DATE)\]' docs/PRIVACY_POLICY.md docs/TERMS_OF_USE.md; then
            echo 'Production release blocked: privacy/terms placeholders remain.'
            exit 1
          fi

      - name: Confirm release documentation exists
        run: |
          test -f docs/PRIVACY_POLICY.md
          test -f docs/TERMS_OF_USE.md
          test -f docs/PRODUCTION_RELEASE.md
          test -f supabase/config.toml
          test -d supabase/migrations
          test -d supabase/functions

      - name: Release gate passed
        run: echo 'Repository-level release gates passed. Build and sign the native iOS/Android applications locally and complete physical-device/store-console checks.'
